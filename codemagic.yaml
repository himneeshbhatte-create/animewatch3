workflows:
  android-debug:
    name: AnimeVault Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: 3.47.5

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Generate Android platform
        script: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name animevault .
          fi

      - name: Generate AnimeVault app icon
        script: |
          dart run flutter_launcher_icons

      - name: Build debug APK
        script: flutter build apk --debug

      - name: Verify APK
        script: |
          set -e
          test -f build/app/outputs/flutter-apk/app-debug.apk
          echo "APK generated successfully: build/app/outputs/flutter-apk/app-debug.apk"

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
